# [ Global Config ]
max-history=5
sort=+time

# [ BINDING OPTIONS ]
on-button-left=invoke-default-action
on-button-middle=dismiss-group
on-button-right=dismiss
on-touch=invoke-default-action
on-notify=exec mpv /usr/share/sounds/freedesktop/stereo/message.oga

# [ STYLE OPTIONS ]
font= Meslo LG M 12

background-color=#140f1fcc
text-color=#eee9ff

width=299
height=99

outer-margin=1
margin=10
padding=10

border-size=2
border-color=#6E5BAAcc
border-radius=14

progress-color=over #6E5BAA

icons=1
max-icon-size=34
icon-location=left

actions=0
history=1

text-alignment=center

default-timeout=3500
max-visible=5

layer=top
anchor=top-right
